services:
  db:
    image: pgvector/pgvector:pg16
    container_name: street-smart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: streetsmart
      POSTGRES_PASSWORD: streetsmart
      POSTGRES_DB: streetsmart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
